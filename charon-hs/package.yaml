name: charon-hs
version: 0.1.0.0
synopsis: Haskell bindings for Charon LLBC
description: Auto-generated Haskell types and Aeson FromJSON instances for Charon's LLBC AST
license: Apache-2.0
author: Charon Team
maintainer: charon@example.com
category: Development

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: 
    - src
    - src/generated
  exposed-modules:
    - Generated_Meta
    - Generated_Values
    - Generated_Types
    - Generated_Expressions
    - Generated_GAst
    - Generated_LlbcAst
    - Generated_UllbcAst
    - Charon.Printing
    - Generated_Krate
  dependencies:
    - base >= 4.14 && < 5
    - aeson >= 2.0
    - text >= 1.2
    - unordered-containers >= 0.2
    - vector >= 0.12

tests:
  charon-hs-test:
    main: Main.hs
    source-dirs: test
    other-modules:
      - Test.Deserialize
      - Test.Printing
      - Test.Print
      - Test.PrintComparison
    dependencies:
      - base >= 4.14 && < 5
      - charon-hs
      - aeson >= 2.0
      - text >= 1.2
      - bytestring >= 0.10
      - directory >= 1.3
      - filepath >= 1.4
      - tasty >= 1.4
      - tasty-hunit >= 0.10
